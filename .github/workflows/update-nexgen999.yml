name: Update nexgen999 PLDMNGR catalog

on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate PLDMNGR catalog
        run: python3 generate_nexgen999.py
      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- payloads-nexgen999.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads-nexgen999.json
          git commit -m "Update nexgen999 PLDMNGR catalog"
          git push
