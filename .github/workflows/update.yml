name: Update PS5SX2 catalog

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate catalog from latest official release
        run: python3 generate.py

      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- payloads.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          git commit -m "Update PS5SX2 payload catalog"
          git push
